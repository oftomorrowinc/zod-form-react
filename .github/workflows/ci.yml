name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      # `effective verify` is the diff-only verification path; only run on PRs
      # where there's a base ref to diff against.
      - name: Effective verify (diff against base)
        if: github.event_name == 'pull_request'
        run: pnpm exec effective verify --against ${{ github.base_ref }}
